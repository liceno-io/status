owner: liceno-io
repo: status
# No Actions secret is exposed to the monitor; the generated workflows carry SECRETS_CONTEXT '{}'.
secrets: []

sites:
  - name: Liceno website
    url: https://liceno.io
    expectedStatusCodes:
      - 200
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; Upptime/1.0; +https://github.com/liceno-io/status)"
  - name: Liceno beta
    url: https://beta.liceno.io
    expectedStatusCodes:
      - 200
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; Upptime/1.0; +https://github.com/liceno-io/status)"

status-website:
  cname: status.liceno.io
  name: Liceno Status
  introTitle: "**Liceno Status**: real-time uptime of Liceno's public services."
  introMessage: This status page uses real-time data from our [GitHub repository](https://github.com/liceno-io/status).
  navbar:
    - title: Status
      href: /
    - title: Liceno
      href: https://liceno.io
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
